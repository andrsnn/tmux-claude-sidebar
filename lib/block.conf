# Managed by tmux-claude-sidebar (install.sh rewrites this block; uninstall.sh
# removes it). Lines of yours it disabled are prefixed "# [tmux-claude-sidebar]".
#
# Plugins, cloned without TPM and pinned to a reviewed commit:
#   tmux-plugins/tmux-sensible  v3.0.0  2ce7679f9dcf42dffa60abd59a3405b87cb8213b
#   catppuccin/tmux             v2.3.2  32d0a8d95d562dd064a62a09d41af136561ae659
# sensible v3.0.0 still sets the removed utf8 options; hide those errors.
run-shell '~/.tmux/plugins/tmux-sensible/sensible.tmux 2>/dev/null'

# Claude Code inside tmux: Shift+Enter, images/OSC passthrough.
set -g allow-passthrough on
set -s extended-keys on
set -s terminal-features[70] 'xterm*:extkeys'

set -g base-index 1
set -gw pane-base-index 1

# catppuccin: window names from #W (see sidebar.conf), tmux's own flags so a
# bell shows as a yellow "!" tab. Plain separators, so no Nerd Font needed.
set -g @catppuccin_flavor mocha
set -g @catppuccin_window_status_style basic
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags text
# catppuccin's tab colors cover tmux's bell style, so turn the window-number
# box yellow while the bell flag is set (evaluated when the tab is drawn).
set -g @catppuccin_window_number_color "#{?window_bell_flag,#{@thm_yellow},#{@thm_overlay_2}}"
run-shell ~/.tmux/plugins/catppuccin/catppuccin.tmux

source-file ~/.tmux/sidebar/sidebar.conf
