# Right-click on a sidebar row. sidebar.sh save-right-click turns this into a
# MouseDown3Pane binding, adding tmux's own right-click as the else branch.
#
# The menu is opened right here, in the mouse binding, because tmux 3.4 gives
# a menu opened from a script no mouse support (a click closes it). The row
# under the mouse is looked up in the sidebar's @sidebar_rows, which render.sh
# keeps as " <row>=<window id>=<index>=<state>=<verdict>= ..." and the window
# is noted in @sidebar_menu_win while the mouse position is known: menu
# commands run later, when it is not.
bind-key -T root MouseDown3Pane if-shell -F -t = '#{@sidebar}' {
  if-shell -F -t = '#{m/r: #{mouse_y}=@,#{@sidebar_rows}}' {
    set-option -gF @sidebar_menu_win '#{s/^.* #{mouse_y}=(@[0-9]+)=.*/\1/:@sidebar_rows}'
    display-menu -O -t = -x M -y M -T '#[align=centre] Window #{s/^.* #{mouse_y}=@[0-9]+=([0-9]+)=.*/\1/:@sidebar_rows} ' \
      'Switch to window' s { run-shell -b '~/.tmux/sidebar/sidebar.sh act select #{q:client_name}' } \
      '#{?#{m/r: #{mouse_y}=@[0-9]+=[0-9]+=review=,#{@sidebar_rows}},Mark as reviewed,}' r { run-shell -b '~/.tmux/sidebar/sidebar.sh act reviewed #{q:client_name}' } \
      '#{?#{m/r: #{mouse_y}=@[0-9]+=[0-9]+=[a-z]*=followup=,#{@sidebar_rows}},Mark as wrapped up,}' w { run-shell -b '~/.tmux/sidebar/sidebar.sh act wrapped #{q:client_name}' } \
      '#{?#{m/r:=review=,#{@sidebar_rows}},Mark all as reviewed,}' a { run-shell -b '~/.tmux/sidebar/sidebar.sh act reviewed-all #{q:client_name}' } \
      '#{?#{m/r:=followup=,#{@sidebar_rows}},Mark all to-dos done,}' o { run-shell -b '~/.tmux/sidebar/sidebar.sh act wrapped-all #{q:client_name}' } \
      '' \
      'Move up' u { run-shell -b '~/.tmux/sidebar/sidebar.sh act up #{q:client_name}' } \
      'Move down' d { run-shell -b '~/.tmux/sidebar/sidebar.sh act down #{q:client_name}' } \
      'Move to the top' t { run-shell -b '~/.tmux/sidebar/sidebar.sh act top #{q:client_name}' } \
      '' \
      'Rename...' n { run-shell -b '~/.tmux/sidebar/sidebar.sh act rename #{q:client_name}' } \
      'Close...' x { run-shell -b '~/.tmux/sidebar/sidebar.sh act close #{q:client_name}' } \
      '' \
      '#{?#{==:#{@claude_sidebar_keys},position},Number keys: back to window numbers,Number keys: jump to list rows}' k { run-shell -b '~/.tmux/sidebar/sidebar.sh keys toggle' } \
      '#{?#{==:#{@claude_sidebar_judge},off},Turn on,Turn off} the AI follow-up check' j { run-shell -b '~/.tmux/sidebar/sidebar.sh judge toggle' }
  }
} {
