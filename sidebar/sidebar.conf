# tmux-claude-sidebar: hooks, bindings and window naming.
# Sourced from the marked block in ~/.tmux.conf. Safe to source repeatedly:
# hooks use fixed array indexes, so a reload replaces them instead of adding.

set -g mouse on
set -gw monitor-bell on
# Terminal focus tells "looking at this window" from "away in another app".
set -s focus-events on

# Name each window from the title Claude Code sets (pane_title), minus any
# leading spinner glyph. Fall back to the directory (without a "codez-"
# prefix) when the title is empty, the generic "Claude Code", or the hostname.
# Note: [^a-zA-Z0-9] is used because [:alnum:] breaks tmux's format parser.
set -gw automatic-rename on
set -gw automatic-rename-format '#{?#{||:#{==:#{s/^[^a-zA-Z0-9]+//:pane_title},},#{||:#{==:#{s/^[^a-zA-Z0-9]+//:pane_title},Claude Code},#{||:#{==:#{pane_title},#{host}},#{==:#{pane_title},#{host_short}}}}},#{s/^codez-//:#{b:pane_current_path}},#{s/^[^a-zA-Z0-9]+//:pane_title}}'

# #{q:...} shell-quotes values: a session id like $1 would otherwise be
# expanded by the shell that run-shell starts.

# Add a sidebar to new windows and sessions.
# window-linked fires for new-window, break-pane, move-window and link-window.
set-hook -g window-linked[70] 'run-shell -b "~/.tmux/sidebar/sidebar.sh ensure #{q:window_id}"'
set-hook -g session-created[70] 'run-shell -b "~/.tmux/sidebar/sidebar.sh ensure-session #{q:session_id}"'
# Close a window once only its sidebar is left; keep widths fixed.
set-hook -g pane-exited[70] 'run-shell -b "~/.tmux/sidebar/sidebar.sh cleanup"'
set-hook -g after-kill-pane[70] 'run-shell -b "~/.tmux/sidebar/sidebar.sh cleanup"'
set-hook -g window-resized[70] 'run-shell -b "~/.tmux/sidebar/sidebar.sh resize #{q:window_id}"'
set-hook -g client-resized[70] 'run-shell -b "~/.tmux/sidebar/sidebar.sh resize"'
# Never leave the sidebar as the active pane.
set-hook -g after-select-pane[70] 'run-shell -b "~/.tmux/sidebar/sidebar.sh guard #{q:window_id}"'

# A finished Claude window shows "review" until you look at it: switching to
# it, or coming back to the terminal while it is the current window.
set-hook -g session-window-changed[70] 'run-shell -b "~/.tmux/sidebar/sidebar.sh seen"'
set-hook -g client-session-changed[70] 'run-shell -b "~/.tmux/sidebar/sidebar.sh seen"'
set-hook -g client-focus-in[70] 'run-shell -b "~/.tmux/sidebar/sidebar.sh seen"'
set-hook -g client-attached[70] 'run-shell -b "~/.tmux/sidebar/sidebar.sh seen"'

# prefix S: hide or show the sidebar in every window of this session.
bind-key S run-shell -b '~/.tmux/sidebar/sidebar.sh toggle #{q:session_id}'
# prefix F: search the prompts of every Claude window and jump to one.
bind-key F run-shell -b '~/.tmux/sidebar/sidebar.sh search #{q:client_name}'
# prefix T: scheduled tasks (run a prompt or skill on a schedule).
bind-key T run-shell -b '~/.tmux/sidebar/sidebar.sh sched #{q:client_name}'
# The scheduler: one per tmux server, it exits when the server does.
run-shell -b 'python3 -I ~/.tmux/sidebar/sched.py daemon'
# The window order chosen last time (needs-you-first, or window number).
run-shell '~/.tmux/sidebar/sidebar.sh sort load'
# prefix 1-9: window numbers (tmux's default) or rows of the list, as chosen.
run-shell '~/.tmux/sidebar/sidebar.sh keys load'
# Whether finished turns get the AI wrapped-up / follow-up check (default on).
run-shell '~/.tmux/sidebar/sidebar.sh judge load'
# After how many days without a status change a window counts as stale.
run-shell '~/.tmux/sidebar/sidebar.sh stale load'

# Clicks on the sidebar run the row's action without focusing it. Clicks
# anywhere else do exactly what tmux's default binding does.
bind-key -n MouseDown1Pane if-shell -F -t = '#{@sidebar}' {
  run-shell -b -t = '~/.tmux/sidebar/sidebar.sh click #{q:pane_id} #{q:mouse_x} #{q:mouse_y} #{q:client_name}'
} {
  select-pane -t = ; send-keys -M
}

# Right-click on a sidebar row: a menu to move, rename, mark or close that
# window. Elsewhere right-click keeps tmux's own menu (saved by the script).
run-shell '~/.tmux/sidebar/sidebar.sh save-right-click'

# Dragging the sidebar's border sets the width for every sidebar. tmux has no
# binding for the end of a border drag by default, so this adds nothing else.
bind-key -n MouseDragEnd1Border run-shell -b '~/.tmux/sidebar/sidebar.sh dragged #{q:window_id}'

# tmux 3.8 binds Ctrl+drag to "new-pane -M" (it draws a new floating pane with
# a shell in it) and Option+drag to "move-pane -M". With mouse mode on, a drag
# with either key held over Claude Code opened a stray shell or moved panes,
# the sidebar included. Make those drags do what a plain drag does.
bind-key -n C-MouseDrag1Pane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -M }
bind-key -n M-MouseDrag1Pane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -M }
bind-key -n M-MouseDrag1Border resize-pane -M

# Add sidebars to windows that already exist.
run-shell -b '~/.tmux/sidebar/sidebar.sh ensure-all'
